sonar.projectKey=ilm_hashicorp-vault-connector
sonar.organization=ilm

sonar.go.coverage.reportPaths=coverage.out
sonar.go.golangci-lint.reportPaths=golangci-lint-report.xml

sonar.test.inclusions=**/*_test.go
# The generated OpenAPI DTOs and the thin main wiring have no meaningful unit
# coverage and must not drag the coverage ratio down. internal/db/db.go opens the
# database and runs the migrations, which needs a live PostgreSQL.
sonar.coverage.exclusions=**/*_test.go,internal/model/**,cmd/main.go,internal/db/db.go
